[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuya-local-bridge"
version = "0.1.0"
description = "Join Tuya cloud local keys to LAN-discovered devices for tuya-local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vortitron" }]
dependencies = [
    "requests>=2.28",
    "tuya-device-sharing-sdk>=0.2.0",
]

[project.optional-dependencies]
lan = ["tinytuya>=1.13"]
qr = ["qrcode[pil]>=7.4"]
web = ["flask>=3.0"]
dev = ["pytest>=7", "tinytuya>=1.13", "qrcode[pil]>=7.4", "flask>=3.0"]

[project.scripts]
tuya-local-bridge = "tuya_local_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["tuya_local_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
