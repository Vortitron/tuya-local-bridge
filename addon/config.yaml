---
name: Tuya Local Bridge
version: "0.1.29"
slug: tuya_local_bridge
description: >-
  Find the local keys for your Tuya devices and move them to local control,
  without a Tuya developer account or an IoT Core subscription.
url: https://github.com/Vortitron/tuya-local-bridge
image: ghcr.io/vortitron/{arch}-tuya-local-bridge
arch:
  - aarch64
  - amd64
init: false

# Ingress puts the UI inside the Home Assistant sidebar, so no port is exposed
# and Home Assistant handles authentication. The port is left unset: 8099 is
# the Supervisor default, and declaring it again is a lint error.
ingress: true
panel_icon: mdi:lan-connect
panel_title: Tuya Local

# Needed to read discovery flows and to create tuya-local config entries.
homeassistant_api: true

# Tuya devices announce themselves by UDP broadcast on 6666/6667/7000, which
# only reaches us on the host network. Without this the add-on still works via
# Home Assistant's own discovery, but cannot see already-converted devices or
# read protocol versions.
host_network: true

options:
  scan_seconds: 18
  heal_interval_hours: 6
  log_level: info
schema:
  scan_seconds: int(0,120)
  heal_interval_hours: float(0,168)
  log_level: list(debug|info|warning|error)
